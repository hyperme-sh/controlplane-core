name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: read
      packages: write
    concurrency:
      group: storage-moving-test-${{ github.repository }}
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: package-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate core package
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: >-
          bash scripts/anonymous-command.sh env
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR"
          TEST_EVIDENCE_DIR="$TEST_EVIDENCE_DIR"
          TEST_DATABASE_URL="$TEST_DATABASE_URL"
          bash scripts/check-package.sh --contracts
      - name: Qualify storage-only runtime against the job database
        env:
          QUALIFIED_IMAGE_REF: storage:ci-${{ github.run_id }}-${{ github.run_attempt }}
          STORAGE_TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@host.docker.internal:${{ job.services.postgres.ports['5432'] }}/postgres
        run: bash scripts/check-container.sh
      - name: Advance moving TEST from qualified current main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_IMAGE_REF: storage:ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/publish-test-runtime.sh
      - name: Remove job-owned local storage image
        if: always()
        run: docker image rm "storage:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
