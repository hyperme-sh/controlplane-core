name: Storage provider database contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  storage-provider:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: provider-contract-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Install verified dependency fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_paths=$(python3 scripts/verify_dependency_fixtures.py "$PWD")
          mapfile -t fixture_wheels <<< "$fixture_paths"
          uv sync --frozen --python 3.13 \
            --no-install-package controlplane-api --no-install-package controlplane-tenancy \
            --no-install-package controlplane-identity --no-install-package controlplane-db \
            --no-install-package controlplane-events --no-install-package operator-ban-store
          uv pip install --python .venv/bin/python --no-deps --reinstall "${fixture_wheels[@]}"
      - name: Check restricted tenant configuration against disposable PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:provider-contract-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: .venv/bin/python -m pytest -q tests/test_storage_provider_database.py
