name: Anonymous package qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: package-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Prepare job-local container input
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/core-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify locked public dependencies, package forms and Storage skew
        env:
          CORE_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/anonymous-command.sh env RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" CORE_BASE_REVISION="$CORE_BASE_REVISION" bash -e <<'SH'
          bash scripts/check-package.sh --contracts
          .venv/bin/python scripts/check-storage-skew.py --baseline "$CORE_BASE_REVISION"
          SH
      - name: Qualify storage container and installed notice bytes
        env:
          QUALIFIED_IMAGE_REF: storage:ci-${{ github.run_id }}-${{ github.run_attempt }}
          STORAGE_TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@host.docker.internal:${{ job.services.postgres.ports['5432'] }}/postgres
        run: bash scripts/check-container.sh
      - name: Remove job-owned local storage image
        if: always()
        run: docker image rm "storage:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
