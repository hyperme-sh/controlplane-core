name: Isolated consumer qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - run: bash scripts/check-package.sh --fixtures --contracts
      - name: Allocation proof unit coverage
        run: |
          uv pip install --python .venv/bin/python --no-deps coverage==7.17.3
          .venv/bin/python -m coverage run --branch --source=api.domain.media_allocation_grant,api.domain.media_allocation_store -m pytest -q tests/test_media_allocation_grant.py tests/test_media_allocation_store.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: Retain matching package test inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-test-results/*.xml
          if-no-files-found: error
          retention-days: 90
