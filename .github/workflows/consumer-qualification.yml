name: Isolated consumer qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:dae2a5f96553962901304b94e72ef87e299d0825e4b679673bcc527a25076fe4
        env:
          AZURITE_ACCOUNTS: s3rchfixture:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        ports:
          - 10000/tcp
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: package-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - run: bash scripts/check-package.sh --fixtures --contracts
      - name: Allocation proof unit coverage
        run: |
          uv pip install --python .venv/bin/python --no-deps coverage==7.17.3
          .venv/bin/python -m coverage run --branch --source=api.domain.media_allocation_grant,api.domain.media_allocation_store,api.domain.media_allocation_issuer,api.domain.media_allocation_request,api.infrastructure.persistence.media_allocation_postgres -m pytest -q tests/test_media_allocation_grant.py tests/test_media_allocation_store.py tests/test_media_allocation_issuer.py tests/test_media_allocation_postgres.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: Signed retirement command coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=api.domain.media_retirement_request,api.infrastructure.persistence.media_retirement_postgres -m pytest -q tests/test_media_retirement_request.py tests/test_media_retirement_postgres.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: PostgreSQL allocation consumer contracts
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          STORAGE_SCHEMA_DIRECTORY: ${{ runner.temp }}/allocation-storage-schema
        run: |
          python3 scripts/prepare-storage-schema.py tests_artifacts/storage-schema "$STORAGE_SCHEMA_DIRECTORY"
          .venv/bin/python -m pytest -v qualification/test_media_allocation_postgres.py qualification/test_media_object_postgres.py --junitxml="$TEST_EVIDENCE_DIR/allocation-storage.xml"
      - name: Media reference and cleanup coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=api.infrastructure.persistence.media_object_postgres,api.domain.media_retirement -m pytest -q tests/test_media_object_postgres.py tests/test_media_retirement.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: Media provider retirement coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=api.infrastructure.externals.media_retirement_backend -m pytest -q tests/test_media_retirement_backend.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: Azure media retirement provider contract
        env:
          AZURITE_BLOB_ORIGIN: http://127.0.0.1:${{ job.services.azurite.ports['10000'] }}
        run: .venv/bin/python -m pytest -v qualification/test_media_provider_retirement.py --junitxml="$TEST_EVIDENCE_DIR/media-provider.xml"
      - name: Allocation transport and configuration coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=api.infrastructure.security.media_allocation_settings,api.infrastructure.security.media_registry_settings,api.interfaces.api_controllers.media_allocation_endpoint -m pytest -q tests/test_media_allocation_endpoint.py tests/test_media_registry_settings.py
          .venv/bin/python -m coverage report --fail-under=90 --show-missing
      - name: Media retirement transport coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=api.interfaces.api_controllers.media_retirement_endpoint,api.interfaces.api_controllers.media_payload_endpoint -m pytest -q tests/test_media_retirement_endpoint.py tests/test_media_payload_endpoint.py
          .venv/bin/python -m coverage report --fail-under=90 --show-missing
      - name: Retain matching package test inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-test-results/*.xml
          if-no-files-found: error
          retention-days: 90
