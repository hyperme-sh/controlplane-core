[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "operator-ban-store @ git+https://github.com/hyperme-sh/user-service.git@8abb59070b9a9f269e39c1955459cead88c7f6c6#subdirectory=core/user-service/contracts",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0f9dbf4e63b86b692936e6f91d4eda832cbf19ad",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@0ed0ab50548f65fdd63ffb7ef614527a7a5158a6",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@e7c8f42080f41a85a43f5dbbad2cb05ac958c823",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@abdcad2f82b827c4898963dc6b3f0025ed68b9d3",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@a04d980e25f71cb1d52fec7f8525633d5eb09e8f",
    "azure-storage-blob>=12.26.0",
    "boto3>=1.40.32",
    "celery[redis]>=5.3.1",
    "colorlog>=6.9.0",
    "faker>=37.8.0",
    "fastapi-mail>=1.5.0",
    "python-keycloak>=5.1.0",
    "fastapi[standard]>=0.135.0",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "langchain>=0.3.27",
    "langchain-ollama>=0.3.8",
    "langchain-openai>=0.3.33",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "punq>=0.7.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.21.1",
    "pyjwt>=2.10.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.1.1",
    "redis>=6.4.0",
    "starlette>=0.48.0",
    "streamlit>=1.49.1",
    "stripe>=13.0.1",
    "uvicorn>=0.37.0",
    "webauthn>=2.7.0",
]

[project.optional-dependencies]
servicebus = [
    "azure-servicebus>=7.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/integration", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
