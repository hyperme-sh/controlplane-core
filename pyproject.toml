[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "operator-ban-store @ git+https://github.com/hyperme-sh/user-service.git@7f79e3b2e330ac312aca01dd0de57fa2ac4ddec3#subdirectory=core/user-service/contracts",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@edac59b2cc55923c983a11a451c4bed9ce53edef",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@447f779e5cc7f1a30f518434f42fcd2ccbadcb19",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5675e7b617db705a7b0caf25f2d65d8a492f32b1",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@17e8c60bc2fea5af890299624ec97e1e7148b2a2",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@d8bc887460c08f30c6a1dcb951bac042bad326a7",
    "azure-storage-blob>=12.26.0",
    "boto3>=1.40.32",
    "celery[redis]>=5.3.1",
    "colorlog>=6.9.0",
    "faker>=37.8.0",
    "fastapi-mail>=1.5.0",
    "python-keycloak>=5.1.0",
    "fastapi[standard]>=0.135.0",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "langchain>=0.3.27",
    "langchain-ollama>=0.3.8",
    "langchain-openai>=0.3.33",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "punq>=0.7.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.21.1",
    "pyjwt>=2.10.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.1.1",
    "redis>=6.4.0",
    "starlette>=0.48.0",
    "streamlit>=1.49.1",
    "stripe>=13.0.1",
    "uvicorn>=0.37.0",
    "webauthn>=2.7.0",
]

[project.optional-dependencies]
servicebus = [
    "azure-servicebus>=7.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/integration", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
